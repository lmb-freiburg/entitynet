<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Change: Referencing a json file only works when running a webserver and not
     when running locally. Because of this, I moved the JSON data into this file.
     To use it, copy the JSON data into the div with id="jsondata" below.
     -->

    <meta charset="utf-8">

    <title>TITLE_PLACEHOLDER_STRING</title>

    <style>
        .node circle {
            fill: #fff;
            stroke: steelblue;
            stroke-width: 3px;
        }

        .node text {
            font: 12px sans-serif;
        }

        .link {
            fill: none;
            stroke: #ccc;
            stroke-width: 2px;
        }
    </style>

<!-- HEAD_PLACEHOLDER -->

</head>

<body onload="loadlocally()">

<!-- BODY_PLACEHOLDER -->

<!-- load the d3.js library -->
<script src="./d3.min.js"></script>

<script>
    function loadlocally() {

        treeData = JSON.parse(document.getElementById("jsondata").innerHTML);
        var base_width = treeData[1];
        var base_height = treeData[2];

        // ************** Generate the tree diagram	 *****************
        var margin = {top: 20, right: 120, bottom: 20, left: 120},
            width = base_width - margin.right - margin.left,
            height = base_height - margin.top - margin.bottom;

        var i = 0;

        var tree = d3.layout.tree()
            .size([height, width]);

        var diagonal = d3.svg.diagonal()
            .projection(function (d) {
                return [d.y, d.x];
            });

        var svg = d3.select("body").append("svg")
            .attr("width", width + margin.right + margin.left)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
            .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

        update(treeData[0]);

        // // load the external data
        // d3.json("source.json", function (error, treeData) {
        //     update(treeData[0]);
        // });

        // d3.json("source.json", function (error, treeData) {
        //     update(treeData[0]);
        // });


        function update(root) {

            // Compute the new tree layout.
            var nodes = tree.nodes(root).reverse(),
                links = tree.links(nodes);

            // Normalize for fixed-depth.
            nodes.forEach(function (d) {
                d.y = d.depth * 180;
            });

            // Declare the nodes…
            var node = svg.selectAll("g.node")
                .data(nodes, function (d) {
                    return d.id || (d.id = ++i);
                });

            // Enter the nodes.
            var nodeEnter = node.enter().append("g")
                .attr("class", "node")
                .attr("transform", function (d) {
                    return "translate(" + d.y + "," + d.x + ")";
                });

            nodeEnter.append("circle")
                .attr("r", 10)
                //.style("fill", "#fff");
                .style("fill", function (d) {
                    return d.color;
                });

            nodeEnter.append("a")
                .attr("xlink:href", function(d) {
                    return d.url;
                })
                .attr("target", "_blank")
                .append("text")
                .attr("x", function (d) {
                    return d.children || d._children ? -13 : 13;
                })
                .attr("dy", ".35em")
                .attr("text-anchor", function (d) {
                    return d.children || d._children ? "end" : "start";
                })
                .text(function (d) {
                    return d.name;
                })
                .style("fill-opacity", 1);



            // Declare the links…
            var link = svg.selectAll("path.link")
                .data(links, function (d) {
                    return d.target.id;
                });

            // Enter the links.
            link.enter().insert("path", "g")
                .attr("class", "link")
                .attr("d", diagonal);

        }
    }

</script>
